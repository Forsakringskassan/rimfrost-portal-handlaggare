version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# Rimfrost — full stack
#
# Usage:
#   1. Copy .env.docker.example to .env.docker and fill in your internal URLs.
#   2. docker compose --env-file .env.docker up
#
# Services
#   rimfrost-portal-fe          Port 8080  — host / shell application
#   rimfrost-portal-bff         Port 9001  — portal BFF (tasks, handläggare)
#   rimfrost-rtf-manuell-fe     Port 8081  — RTF Manuell micro-frontend
#   rimfrost-rtf-manuell-bff    Port 9002  — RTF Manuell BFF
#   rimfrost-bekraftabeslut-fe  Port 8082  — Bekräfta Beslut micro-frontend
#   rimfrost-bekraftabeslut-bff Port 9003  — Bekräfta Beslut BFF
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Portal frontend (host app) ──────────────────────────────────────────────
  rimfrost-portal-fe:
    build:
      context: ../rimfrost-portal-handlaggare
      dockerfile: Dockerfile
    container_name: rimfrost-portal-fe
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - ASSET_DIR=/usr/local/apache2/htdocs
      - APP_PREFIX=RUNTIME_
      # URL of the portal BFF — must be reachable from the user's browser
      - RUNTIME_BFF_URL=${RUNTIME_BFF_URL:-http://localhost:9001}
      # remoteEntry.js URLs for the micro-frontends — must be reachable from the browser
      - RUNTIME_REMOTE_APP_URL=${RUNTIME_REMOTE_APP_URL:-http://localhost:8081/assets/remoteEntry.js}
      - RUNTIME_EXAMPLE_APP_URL=${RUNTIME_EXAMPLE_APP_URL:-http://localhost:8082/assets/remoteEntry.js}
    networks:
      - rimfrost-network
    depends_on:
      - rimfrost-portal-bff
      - rimfrost-rtf-manuell-fe
      - rimfrost-bekraftabeslut-fe
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Portal BFF ──────────────────────────────────────────────────────────────
  rimfrost-portal-bff:
    build:
      context: ../rimfrost-portal-bff
      dockerfile: Dockerfile
    container_name: rimfrost-portal-bff
    ports:
      - "9001:9001"
    restart: unless-stopped
    environment:
      - PORT=9001
      - HANDLAGGARE_URL=${HANDLAGGARE_URL}
      - BE_OUL_URL=${BE_OUL_URL}
    networks:
      - rimfrost-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── RTF Manuell micro-frontend ──────────────────────────────────────────────
  rimfrost-rtf-manuell-fe:
    build:
      context: ../rimfrost-regel-rtf-manuell-fe
      dockerfile: Dockerfile
    container_name: rimfrost-rtf-manuell-fe
    ports:
      - "8081:8080"
    restart: unless-stopped
    environment:
      - ASSET_DIR=/usr/local/apache2/htdocs
      - APP_PREFIX=RUNTIME_
      # URL of the RTF Manuell BFF — must be reachable from the user's browser
      - RUNTIME_BFF_URL=${RUNTIME_RTF_MANUELL_BFF_URL:-http://localhost:9002}
    networks:
      - rimfrost-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── RTF Manuell BFF ─────────────────────────────────────────────────────────
  rimfrost-rtf-manuell-bff:
    build:
      context: ../rimfrost-regel-rtf-manuell-bff
      dockerfile: Dockerfile
    container_name: rimfrost-rtf-manuell-bff
    ports:
      - "9002:9002"
    restart: unless-stopped
    environment:
      - PORT=9002
      - BE_RTF_MANUELL_URL=${BE_RTF_MANUELL_URL}
      - BE_RULE_PATH=${BE_RTF_MANUELL_RULE_PATH:-regel/rtf-manuell}
    networks:
      - rimfrost-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Bekräfta Beslut micro-frontend ──────────────────────────────────────────
  rimfrost-bekraftabeslut-fe:
    build:
      context: ../rimfrost-regel-bekraftabeslut-fe
      dockerfile: Dockerfile
    container_name: rimfrost-bekraftabeslut-fe
    ports:
      - "8082:8080"
    restart: unless-stopped
    environment:
      - ASSET_DIR=/usr/local/apache2/htdocs
      - APP_PREFIX=RUNTIME_
      # URL of the Bekräfta Beslut BFF — must be reachable from the user's browser
      - RUNTIME_BFF_URL=${RUNTIME_BEKRAFTABESLUT_BFF_URL:-http://localhost:9003}
    networks:
      - rimfrost-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Bekräfta Beslut BFF ─────────────────────────────────────────────────────
  rimfrost-bekraftabeslut-bff:
    build:
      context: ../rimfrost-regel-bekraftabeslut-bff
      dockerfile: Dockerfile
    container_name: rimfrost-bekraftabeslut-bff
    ports:
      - "9003:9003"
    restart: unless-stopped
    environment:
      - PORT=9003
      - BE_BEKRAFTABESLUT_URL=${BE_BEKRAFTABESLUT_URL}
    networks:
      - rimfrost-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  rimfrost-network:
    driver: bridge
